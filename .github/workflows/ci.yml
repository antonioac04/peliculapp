çname: CI

on:
  push:
    branches: [main, develop, feature/jwt]
  pull_request:
    branches: [main, develop, feature/jwt]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      APP_ENV: testing
      APP_KEY: ${{ secrets.APP_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Auth Tests
        run: php artisan test tests/Feature/Auth/JwtAuthTest.php

      - name: Run Director Tests
        run: php artisan test tests/Feature/Directores/DirectorTest.php

      - name: Run Film Tests
        run: php artisan test tests/Feature/Peliculas/FilmTest.php

      - name: Run Security Tests
        run: php artisan test tests/Feature/Security

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t peliculapp:test .

      - name: Verify container starts
        run: |
          docker run -d --name peliculapp-ci -p 8000:8000 peliculapp:test
          sleep 10
          docker ps | grep peliculapp-ci
          docker stop peliculapp-ci

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Composer Audit
        run: composer audit --locked
